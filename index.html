function go(v){view=v;nav();({dash:dash,reg:reg,ven:ven,com:com})[v]?({dash:dash,reg:reg,ven:ven,com:com})[v]():lista(v);window.scrollTo(0,0)}
/* resumen */
function dash(){var d0=day0(),P=S.p,al=P.filter(function(p){return st(p)!="ok"}),days=[];
for(var i=6;i>=0;i--){(function(a){days.push({l:new Date(a).toLocaleDateString("es-MX",{weekday:"short"}),v:S.v.filter(function(x){return x.t>=a&&x.t<a+864e5}).reduce(function(s,x){return s+x.total},0)})})(d0-i*864e5)}
var mx=Math.max.apply(null,days.map(function(x){return x.v}).concat(1));
$("v").innerHTML='<h1>Resumen</h1><div class="stats">'+[["Productos",P.length],["Ropa",cnt("ropa")],["Zapatos",cnt("zapatos")],["Accesorios",cnt("accesorios")],["Pocas existencias",P.filter(function(p){return st(p)=="w"}).length],["Agotados",P.filter(function(p){return st(p)=="r"}).length],["Ventas de hoy",m(sum(S.v,vt,d0))],["Ingresos totales",m(sum(S.v,vt,0))],["Invertido en compras",m(sum(S.c,ct,0))]].map(function(s){return'<div class="card st"><small>'+s[0]+"</small><b>"+s[1]+"</b></div>"}).join("")+
'</div><div class="two"><div class="card"><h3>Alertas</h3>'+(al.length?al.map(function(p){return'<div class="al '+st(p)+'">'+(st(p)=="r"?"⛔ Agotado":"⚠️ Quedan "+p.q)+": <b>"+esc(p.n)+"</b> "+esc(det(p))+"</div>"}).join(""):'<p class="mut">Todo en orden, sin alertas.</p>')+
'</div><div class="card"><h3>Ventas, últimos 7 días</h3><div class="ch">'+days.map(function(x){return"<div><span>"+(x.v?m(x.v):"")+'</span><i style="height:'+Math.round(x.v/mx*75)+'%"></i><small>'+x.l+"</small></div>"}).join("")+"</div></div></div>"+
'<div class="card"><h3>Compras recientes</h3>'+tbl(["Fecha","Producto","Cant.","Costo unit."],S.c.slice(-5).reverse().map(function(c){return[fd(c.t),esc(c.n),c.q,m(c.costo)]}))+"</div>"}
/* categorías */
function lista(c){$("v").innerHTML="<h1>"+CATS[c][1]+" "+CATS[c][0]+'</h1><div class="bar"><input id="q" type="search" placeholder="Buscar por nombre, código o talla…"><select id="fe"><option value="">Todos</option><option value="ok">En stock</option><option value="w">Pocas existencias</option><option value="r">Agotados</option></select><button class="btn" id="add">+ Nuevo</button></div><div id="tb"></div>';
var f=function(){var q=$("q").value.toLowerCase(),e=$("fe").value;
var L=S.p.filter(function(p){return p.cat==c&&(!e||st(p)==e)&&(!q||(p.n+" "+p.cod+" "+det(p)).toLowerCase().indexOf(q)>-1)});
$("tb").innerHTML=L.length?'<div class="pg">'+L.map(function(p){var s=st(p),d=c=="accesorios"?p.desc:det(p);return'<article class="pc"><div class="pi">'+(p.img?'<img src="'+p.img+'" alt="">':"<span>"+CATS[c][1]+"</span>")+'<em class="bd '+s+'">'+(s=="r"?"Agotado":s=="w"?"Pocas":"En stock")+'</em></div><div class="pb"><h4>'+esc(p.n)+"</h4><small>"+esc(p.cod)+"</small><p>"+esc(d)+'</p><div class="pr"><b>'+m(p.pv)+"</b><span>Costo "+m(p.pc)+'</span></div><div class="pf"><span class="qt">'+p.q+' pzas</span><span><button class="ic" data-e="'+p.id+'" aria-label="Editar">✏️</button><button class="ic" data-d="'+p.id+'" aria-label="Eliminar">🗑️</button></span></div></div></article>'}).join("")+"</div>":'<p class="mut">Sin registros todavía.</p>'};
$("q").oninput=f;$("fe").onchange=f;f();$("add").onclick=function(){ed=null;pre=c;go("reg")};
$("tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.e){ed=b.dataset.e;go("reg")}else if(b.dataset.d&&confirm("¿Eliminar este producto?")){delP(b.dataset.d).then(function(){nav();f()})}}}
/* registro */
function reg(){var p=ed?S.p.find(function(x){return x.id==ed}):{cat:pre,fecha:new Date().toISOString().slice(0,10),min:3,q:1};pic=p.img||"";
var f=function(id,l,t,v,x){return"<label>"+l+'<input id="'+id+'" type="'+(t||"text")+'" value="'+esc(v==null?"":v)+'" '+(x||"")+"></label>"};
$("v").innerHTML="<h1>"+(ed?"Editar":"Registrar")+' producto</h1><form id="f" class="card fg"><label>Categoría<select id="cat">'+Object.keys(CATS).map(function(k){return'<option value="'+k+'"'+(p.cat==k?" selected":"")+">"+CATS[k][0]+"</option>"}).join("")+"</select></label>"+
f("n","Nombre","text",p.n,"required maxlength=60")+f("cod","Código del producto","text",p.cod,"required maxlength=30")+
'<span class="x" data-c="ropa">'+f("tipo","Tipo de prenda","text",p.tipo)+'</span><span class="x" data-c="zapatos">'+f("marca","Marca","text",p.marca)+f("modelo","Modelo","text",p.modelo)+'</span><span class="x" data-c="ropa zapatos">'+f("talla","Talla","text",p.talla)+f("color","Color","text",p.color)+"</span>"+
f("pc","Precio de compra","number",p.pc,'min="0" step="0.01" required')+f("pv","Precio de venta","number",p.pv,'min="0" step="0.01" required')+f("q","Cantidad","number",p.q,'min="0" step="1" required')+f("min","Avisar cuando queden (mínimo)","number",p.min,'min="0" step="1" required')+f("fecha","Fecha de registro","date",p.fecha,"required")+
'<label class="w">Descripción<input id="desc" value="'+esc(p.desc||"")+'" maxlength="120"></label><label class="w">Fotografía<input id="img" type="file" accept="image/*"></label><img id="pv" class="pv" alt="Vista previa"'+(pic?' src="'+pic+'"':" hidden")+'><div class="w"><button class="btn">Guardar producto</button></div></form>';
var sh=function(){var c=$("cat").value;[].forEach.call(document.querySelectorAll(".x"),function(x){x.classList.toggle("h",x.dataset.c.split(" ").indexOf(c)<0)})};$("cat").onchange=sh;sh();
$("img").onchange=function(e){var fl=e.target.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,400/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pic=c.toDataURL("image/jpeg",.7);$("pv").src=pic;$("pv").hidden=false};im.src=r.result};r.readAsDataURL(fl)};
$("f").onsubmit=function(e){e.preventDefault();var c=$("cat").value,cod=$("cod").value.trim();
if(S.p.some(function(x){return x.cod.toLowerCase()==cod.toLowerCase()&&x.id!=ed}))return toast("Ya existe un producto con ese código","r");
var id=ed||crypto.randomUUID(),old=ed&&S.p.find(function(x){return x.id==ed}),fp=old?old.fp:"",bt=$("f").querySelector(".btn");bt.disabled=true;
(async function(){try{
if(pic&&pic.indexOf("data:")==0){var bl=await(await fetch(pic)).blob(),path=EMP+"/"+id+".jpg",u=await sb.storage.from("fotos").upload(path,bl,{upsert:true,contentType:"image/jpeg"});if(u.error)throw u.error;fp=path}
var o={empresa_id:EMP,cat:c,nombre:$("n").value.trim(),cod:cod,descr:$("desc").value.trim(),pc:+$("pc").value,pv:+$("pv").value,q:Math.floor(+$("q").value),min:Math.floor(+$("min").value),fecha:$("fecha").value,foto_path:fp||null,tipo:null,marca:null,modelo:null,talla:null,color:null};
if(c=="ropa")o.tipo=$("tipo").value.trim();if(c=="zapatos"){o.marca=$("marca").value.trim();o.modelo=$("modelo").value.trim()}if(c!="accesorios"){o.talla=$("talla").value.trim();o.color=$("color").value.trim()}
var r=ed?await sb.from("productos").update(o).eq("id",id):await sb.from("productos").insert(Object.assign({id:id},o));
if(r.error)throw r.error;
await loadAll();toast(ed?"Producto actualizado":"Registrado en "+CATS[c][0]);ed=null;pre=c;go(c)
}catch(x){bt.disabled=false;toast(x.code=="23505"?"Ya existe un producto con ese código":perr(x),"r")}})()}}
/* ventas */
function ven(){var d=new Date(),opts=S.p.filter(function(p){return p.q>0}).map(function(p){return'<option value="'+p.id+'">'+esc(p.n+" "+det(p))+" ("+p.q+" disp.) "+m(p.pv)+"</option>"}).join(""),tot=cart.reduce(function(a,i){return a+i.q*i.pv},0);
$("v").innerHTML='<h1>Ventas</h1><div class="stats">'+[["Hoy",day0()],["Últimos 7 días",day0()-6*864e5],["Este mes",+new Date(d.getFullYear(),d.getMonth(),1)]].map(function(x){return'<div class="card st"><small>Ingresos: '+x[0]+"</small><b>"+m(sum(S.v,vt,x[1]))+"</b></div>"}).join("")+
'</div><div class="card"><h3>Nueva venta</h3><div class="bar"><select id="sp" style="flex:1 1 220px">'+(opts||'<option value="">Sin productos con existencias</option>')+'</select><input id="sq" type="number" min="1" value="1" style="width:90px"><button class="btn" id="sa">Agregar</button></div>'+
tbl(["Producto","Cant.","Precio","Subtotal",""],cart.map(function(i,k){return[esc(i.n),i.q,m(i.pv),m(i.q*i.pv),'<button class="ic" data-x="'+k+'" aria-label="Quitar">✖</button>']}))+'<p class="tot">Total: <b>'+m(tot)+'</b> <button class="btn" id="sr"'+(cart.length?"":" disabled")+'>Registrar venta</button></p></div><div class="card"><h3>Historial de ventas</h3>'+
tbl(["Fecha","Productos","Total"],S.v.slice(-20).reverse().map(function(v){return[fd(v.t),esc(v.i.map(function(i){return i.q+"× "+i.n}).join(", ")),m(v.total)]}))+"</div>";
$("sa").onclick=function(){var p=S.p.find(function(x){return x.id==$("sp").value}),q=Math.floor(+$("sq").value);if(!p||q<1)return toast("Elige producto y cantidad","r");
var ya=cart.filter(function(i){return i.id==p.id}).reduce(function(a,i){return a+i.q},0);if(ya+q>p.q)return toast("Solo hay "+p.q+" en existencia","r");
var l=cart.find(function(i){return i.id==p.id});if(l)l.q+=q;else cart.push({id:p.id,n:p.n+" "+det(p),q:q,pv:p.pv});ven()};
$("v").onclick=function(e){var b=e.target.closest("[data-x]");if(b){cart.splice(+b.dataset.x,1);ven()}};
$("sr").onclick=async function(){this.disabled=true;var r=await sb.rpc("registrar_venta",{p_empresa:EMP,p_items:cart.map(function(i){return{producto_id:i.id,cant:i.q}})});
if(r.error){await loadAll();toast(perr(r.error),"r");return ven()}
await loadAll();cart=[];toast("Venta registrada y inventario actualizado");nav();ven()}}
/* compras */
function com(){var opts=S.p.map(function(p){return'<option value="'+p.id+'">'+esc(p.n+" "+det(p))+" ("+p.q+" disp.)</option>"}).join("");
$("v").innerHTML='<h1>Compras</h1><div class="stats"><div class="card st"><small>Invertido en mercancía</small><b>'+m(sum(S.c,ct,0))+"</b></div></div>"+(opts?'<form id="cf" class="card fg"><label class="w">Producto comprado<select id="cp">'+opts+'</select></label><label>Cantidad<input id="cq" type="number" min="1" step="1" required></label><label>Costo unitario<input id="cc" type="number" min="0" step="0.01" required></label><label>Fecha<input id="cd" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></label><div class="w"><button class="btn">Registrar compra</button></div></form>':'<div class="card mut">Primero registra productos para poder comprar mercancía.</div>')+
'<div class="card"><h3>Historial de compras</h3>'+tbl(["Fecha","Producto","Cant.","Costo unit.","Total"],S.c.slice(-20).reverse().map(function(c){return[fd(c.t),esc(c.n),c.q,m(c.costo),m(c.q*c.costo)]}))+"</div>";
if(opts)$("cf").onsubmit=async function(e){e.preventDefault();var q=Math.floor(+$("cq").value),c=+$("cc").value;if(q<1)return;
var r=await sb.rpc("registrar_compra",{p_empresa:EMP,p_producto:$("cp").value,p_cant:q,p_costo:c,p_fecha:$("cd").value});
if(r.error)return toast(perr(r.error),"r");await loadAll();toast("Compra registrada, existencias actualizadas");nav();com()}}
sb.auth.onAuthStateChange(function(ev){if(ev=="PASSWORD_RECOVERY"){recov=1;lmode("nw")}});
sb.auth.getSession().then(function(r){if(recov)return;r.data.session?boot():lmode("in")});
</script></body></html>
